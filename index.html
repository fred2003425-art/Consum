<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零食貨品目錄系統 (加密共用版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-amber-50/40 min-h-screen text-slate-800 pb-12">

  <!-- 1. 密碼驗證遮罩 -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800 mb-1">公司專屬零食目錄</h2>
      <p class="text-xs text-slate-500 mb-6">受保護的內部系統，請輸入密碼以解鎖</p>
      
      <form onsubmit="unlockSystem(event)" class="space-y-4">
        <div>
          <input type="password" id="accessPassword" placeholder="請輸入通行密碼" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-center">
        </div>
        <p id="passwordError" class="text-xs text-rose-500 hidden"><i class="fas fa-exclamation-circle mr-1"></i>密碼不正確！</p>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 rounded-xl shadow-sm text-sm transition">
          進入系統
        </button>
      </form>
    </div>
  </div>

  <!-- 2. 主系統內容 -->
  <div id="appContent" class="hidden">
    <header class="bg-amber-500 text-white shadow-md sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <div class="bg-white/20 p-2.5 rounded-xl text-2xl">🍿</div>
          <div>
            <h1 class="text-xl font-bold">雲端即時同步零食目錄</h1>
            <p class="text-xs text-amber-100">跨裝置同步 · 4000 固定前綴編號</p>
          </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button onclick="openModal()" class="flex-1 sm:flex-none bg-slate-900 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition text-sm">
            <i class="fas fa-plus"></i>
            <span>新增零食貨品</span>
          </button>
          <button onclick="lockSystem()" class="bg-amber-600 hover:bg-amber-700 text-white p-2.5 rounded-xl shadow-sm transition" title="安全登出">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto flex-1 max-w-2xl">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="搜尋 12 位編號或零食簡稱..." oninput="renderItems()" class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
          </div>
          <select id="categoryFilter" onchange="renderItems()" class="px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white">
            <option value="">所有自訂類別</option>
          </select>
        </div>
      </div>

      <div id="itemsContainer"></div>
    </main>

    <!-- 新增視窗 -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white z-10">
          <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增零食貨品</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100"><i class="fas fa-times"></i></button>
        </div>
        <form id="itemForm" onsubmit="saveItem(event)" class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">1. 貨品編號 (4000 + 自行輸入 8 位數字) *</label>
            <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-amber-500">
              <span class="bg-slate-100 text-slate-700 px-3.5 py-2 font-mono font-bold border-r border-slate-200 text-sm">4000</span>
              <input type="text" id="itemSuffix" maxlength="8" placeholder="輸入後8位數字" oninput="validateSuffixInput()" required class="flex-1 px-3 py-2 text-sm font-mono tracking-wider focus:outline-none">
            </div>
            <p id="codeError" class="text-xs text-rose-500 mt-1 hidden">請輸入剛好 8 位純數字</p>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">2. 貨品簡稱 *</label>
            <input type="text" id="itemName" placeholder="例如：手工特濃雪花酥" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">3. 自訂零食類別 *</label>
            <input type="text" id="itemCategory" list="categoryDatalist" placeholder="輸入或選擇類別" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 text-sm">
            <datalist id="categoryDatalist"></datalist>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">4. 內容物件數 *</label>
            <input type="text" id="itemPieceCount" placeholder="例如：12 獨立包 / 8 粒裝" required class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">5. 圖片網址</label>
            <input type="url" id="itemImage" placeholder="https://..." class="w-full px-3.5 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 text-sm">
          </div>
          <div class="pt-3 border-t border-slate-100 flex justify-end space-x-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 text-sm font-medium">取消</button>
            <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-medium">儲存至雲端</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 🔒 預設解鎖密碼
    const SYSTEM_PASSWORD = "Empoempoempo2026!";

    // ⚠️ 請替換為你專屬的 Firebase 金鑰
    const firebaseConfig = {
  apiKey: "AIzaSyDPB0jYf7DpeS61OvoLjpXZLjlY3mHcde8",
  authDomain: "consumables-c799c.firebaseapp.com",
  databaseURL: "https://consumables-c799c-default-rtdb.firebaseio.com",
  projectId: "consumables-c799c",
  storageBucket: "consumables-c799c.firebasestorage.app",
  messagingSenderId: "228134507402",
  appId: "1:228134507402:web:29bc8efbb802cad8e32e73",
  measurementId: "G-TFLTQX4PK2"
    };

    let db;
    let items = [];

    window.onload = function() {
      if (sessionStorage.getItem('snack_app_auth') === 'true') {
        initDatabase();
      }
    };

    function unlockSystem(e) {
      e.preventDefault();
      if (document.getElementById('accessPassword').value === SYSTEM_PASSWORD) {
        sessionStorage.setItem('snack_app_auth', 'true');
        initDatabase();
      } else {
        document.getElementById('passwordError').classList.remove('hidden');
      }
    }

    function lockSystem() {
      sessionStorage.removeItem('snack_app_auth');
      location.reload();
    }

    function initDatabase() {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('appContent').classList.remove('hidden');

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database().ref('snacks');

      db.on('value', (snapshot) => {
        const data = snapshot.val();
        items = [];
        if (data) {
          Object.keys(data).forEach(key => items.push({ id: key, ...data[key] }));
        }
        updateCategoryDatalist();
        renderItems();
      });
    }

    function updateCategoryDatalist() {
      const categories = [...new Set(items.map(i => i.category))].filter(Boolean);
      document.getElementById('categoryDatalist').innerHTML = categories.map(c => `<option value="${c}">`).join('');
      const filter = document.getElementById('categoryFilter');
      const current = filter.value;
      filter.innerHTML = '<option value="">所有自訂類別</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
      filter.value = current;
    }

    function validateSuffixInput() {
      const input = document.getElementById('itemSuffix');
      input.value = input.value.replace(/\D/g, '');
      const isValid = input.value.length === 8;
      document.getElementById('codeError').classList.toggle('hidden', isValid || !input.value);
      return isValid;
    }

    function renderItems() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const catFilter = document.getElementById('categoryFilter').value;
      const container = document.getElementById('itemsContainer');
      const filtered = items.filter(item => {
        const matchesSearch = (item.name || '').toLowerCase().includes(search) || (item.code || '').toLowerCase().includes(search);
        const matchesCat = !catFilter || item.category === catFilter;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 bg-white rounded-2xl border border-slate-100"><p class="text-slate-500 text-sm">目前沒有符合條件的零食貨品</p></div>`;
        return;
      }

      container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">` + filtered.map(item => `
        <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
          <div class="h-48 bg-slate-100 relative">
            <img src="${item.image || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 bg-slate-900/80 text-amber-300 text-[10px] font-mono font-bold px-2.5 py-1 rounded-lg">${item.code}</span>
            <span class="absolute top-3 right-3 bg-amber-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">${item.category}</span>
          </div>
          <div class="p-4">
            <h3 class="font-bold text-slate-800 text-base mb-2">${item.name}</h3>
            <p class="text-xs text-slate-500 mb-4">件數：${item.pieceCount}</p>
            <div class="flex justify-end pt-2 border-t border-slate-50">
              <button onclick="deleteItem('${item.id}')" class="px-3 py-1.5 bg-rose-50 text-rose-600 text-xs font-medium rounded-lg">刪除</button>
            </div>
          </div>
        </div>
      `).join('') + `</div>`;
    }

    function openModal() {
      document.getElementById('itemForm').reset();
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      if (!validateSuffixInput()) return;

      const newItem = {
        code: '4000' + document.getElementById('itemSuffix').value,
        name: document.getElementById('itemName').value,
        category: document.getElementById('itemCategory').value,
        pieceCount: document.getElementById('itemPieceCount').value,
        image: document.getElementById('itemImage').value
      };

      db.push(newItem).then(() => closeModal());
    }

    function deleteItem(id) {
      if (confirm('確定要刪除這筆零食資料嗎？')) {
        db.child(id).remove();
      }
    }
  </script>
</body>
</html>
